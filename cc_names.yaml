# MIDI CC Name Mappings
#
# Maps CC numbers to human-readable names used in preset files.
#
# Two formats are supported:
#
#   FLAT (simple — one set of names used for everything):
#     cc_names:
#       1: modulation
#       7: volume
#
#   NAMED SETS (for multi-destination setups — referenced by destinations.yaml):
#     cc_name_sets:
#       synth_ccs:
#         1: modulation
#         74: filter_cutoff
#       effects_ccs:
#         1: mod_depth
#         20: delay_time
#
# When using destinations, put a "default" set in cc_name_sets for any
# destination that doesn't specify its own set.

cc_names:
  1: modulation
  7: volume
  10: pan
  11: expression
  64: sustain
  74: filter_cutoff
