# Destination Map (optional)
#
# Each top-level key is a destination identifier.  Reserved keys inside
# a destination:
#   prefix    - prepended to inherited CC names (e.g. "ns" → "ns_pan")
#   channels  - dict of MIDI channels (0–15), each containing:
#     cc_group  - inherit a named set from cc_sets.yaml
#     prefix    - override the destination prefix for this channel
#     <int>     - bare integer keys are CC overrides (not prefixed),
#                 can shadow an inherited name
#
# Conflict detection: if two different (channel, CC) pairs resolve to the
# same name within one destination, a warning is logged at startup.

# Example (uncomment and customise for your setup):
#
# nerdseq:
#   prefix: ns
#   channels:
#     0:
#       cc_group: mix_ccs
#     1:
#       cc_group: polysynth_ccs
#       85: nerdseq_perf_out
#     2:
#       cc_group: mix_ccs
#       prefix: ns_fx
#
# bluebox:
#   prefix: bb
#   channels:
#     2:
#       cc_group: mix_ccs

poly:
  prefix: poly
  channels:
    2:
      cc_group: polysynth_ccs
    11:
      prefix: perf
      tags: [poly]
      cc_group: mix_ccs
      vibrato_rate: {default: 78}
      to_duck_out: {default: 127}
mono:
  prefix: mono
  channels:
    1:
      tags: [mono]
      cc_group: mix_ccs
    5:
      prefix: bass
      tags: [mono]
      cc_group: mix_ccs
      to_duck_out: {default: 110}
    10:
      prefix: pads
      cc_group: pad_ccs
      tags: [mono]
loop_a:
  prefix: loop_a
  channels:
    3:
      tags: [loop]
      cc_group: mix_ccs
      to_duck_out: {default: 0}
      to_perf_filter: {default: 63}
loop_b:
  prefix: loop_b
  channels:
    4:
      tags: [loop]
      cc_group: mix_ccs
      to_duck_out: {default: 0}
      to_perf_filter: {default: 63}
loop:
  channels:
    14:
      tags: [loop]
      cc_group: loop_ccs
      poly_morph: {default: 63, tags: [poly]}
